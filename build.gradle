buildscript {
    repositories {
        maven {
            // RetroFuturaGradle
            name = "GTNH Maven"
            url = uri("https://nexus.gtnewhorizons.com/repository/public/")
            mavenContent {
                includeGroupByRegex("com\\.gtnewhorizons\\..+")
                includeGroup("com.gtnewhorizons")
            }
        }
        gradlePluginPortal()
        mavenCentral()
        mavenLocal()
        maven { url = "https://jcenter.bintray.com/" }
        maven { url = "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = 'https://repo.spongepowered.org/maven' }
        maven {
            url = "https://jitpack.io"
        }
    }
    dependencies {
        classpath('com.gtnewhorizons:retrofuturagradle:1.4.0')
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

apply plugin: 'com.gtnewhorizons.retrofuturagradle'
apply plugin: 'maven-publish'

repositories {
    maven {
        url "https://cursemaven.com"
    }
}

String umcVersion = "1.2.3"
if (!"release".equalsIgnoreCase(System.getProperty("target"))) {
    try {
        umcVersion += "-" + 'git rev-parse --verify --short=7 HEAD'.execute().text.trim()
    } catch (Exception ex) {
        umcVersion += "-unknown"
    }
}
version = "1.7.10-forge-" + umcVersion
group = "cam72cam.universalmodcore" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "UniversalModCore"

apply plugin: 'java'

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
    // Generate sources and javadocs jars when building and publishing
    withSourcesJar()
    withJavadocJar()
}

// Most RFG configuration lives here, see the JavaDoc for com.gtnewhorizons.retrofuturagradle.MinecraftExtension
minecraft {
    mcVersion.set("1.7.10")
    username.set("Developer")
    useForgeEmbeddedMappings = false
    extraTweakClasses.add("org.spongepowered.asm.launch.MixinTweaker")

    injectedTags.put("VERSION", project.version)

    extraRunJvmArguments.add("-ea:${project.group}")

    groupsToExcludeFromAutoReobfMapping.addAll("com.diffplug", "com.diffplug.durian", "net.industrial-craft")
}

tasks.deobfuscateMergedJarToSrg.configure {accessTransformerFiles.from("src/main/resources/META-INF/UniversalModCore_at.cfg")}

repositories {
    maven { url = "https://repo.spongepowered.org/maven" }
    maven {
        name = "aikar"
        url = "https://repo.aikar.co/content/groups/aikar/"
    }
}

dependencies {
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"
      
    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // the 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    //provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // the deobf configurations:  'deobfCompile' and 'deobfProvided' are the same as the normal compile and provided,
    // except that these dependencies get remapped to your current MCP mappings
    //deobfCompile 'com.mod-buildcraft:buildcraft:6.0.8:dev'
    //deobfProvided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // for more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
	shade "curse.maven:invtweaks-223094:2431302"

    modUtils.enableMixins(annotationProcessor(shade('org.spongepowered:mixin:0.7.11-SNAPSHOT')), 'mixins.universalmodcore.refmap.json')

//    shade('io.github.llamalad7:mixinextras-common:0.5.0')
    implementation('junit:junit:4.13.1')

//    runtime "net.minecrell:terminalconsoleappender:1.3.0"
//    runtime group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.0.2'

    shade group: 'at.yawk.lz4', name: 'lz4-java', version: '1.10.2'
}

//def tempDir = System.getenv("RUNNER_TEMP") == null ? tasks.compileJava.temporaryDir : System.getenv("RUNNER_TEMP")
//
//ext.outRefMapFile = "${tempDir}/mixins.universalmodcore.refmap.json"
//
//def outSrgFile = "${tempDir}/outSrg.srg"
//
//afterEvaluate {
//    tasks.compileJava.options.compilerArgs += ["-AreobfSrgFile=${tasks.reobf.srg}", "-AoutSrgFile=${outSrgFile}", "-AoutRefMapFile=${outRefMapFile}"];
//}
//
//reobf {
//    addExtraSrgFile outSrgFile
//}

jar {
    archiveClassifier = ''
    manifest {
        attributes (
                'FMLCorePlugin': 'cam72cam.mod.UMCMixinPlugin',
                'FMLAT': 'UniversalModCore_at.cfg',
                'FMLCorePluginContainsFMLMod': true,
                "ForceLoadAsMod": true,
                'TweakOrder': '0',
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker'
        )
    }

    from {
//        configurations.shade.collect {
//            zipTree(it)
//        }
    }
//    from outRefMapFile;
}

//jar.finalizedBy('reobf')

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    // copy everything else except the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

test {
    useJUnit()
    maxHeapSize = '1G'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifactId archivesBaseName
        }
    }
    repositories {
        maven {
            url "sftp://teamopenindustry.cc:22/var/www/html/maven/"
            credentials {
                username = "mavenci"
                password = System.getenv("MAVENCI_PASS")
            }
        }
    }
}

task ('showBuildInfo') {
    doLast {
        System.out.println("Build Uploaded to Maven at: ")
        System.out.println("https://teamopenindustry.cc/maven/cam72cam/universalmodcore/UniversalModCore/${version}/UniversalModCore-${version}.jar")
    }
}

publish.finalizedBy showBuildInfo